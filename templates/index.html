<!DOCTYPE html>
<html>
<head>
    <title>Image to Video Prediction</title>
</head>
<body style="text-align:center; font-family: Arial;">

    <h2>Upload Image for frame Prediction</h2>

    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br><br>
        <input type="submit" value="Predict">
    </form>

    {% if show_frames %}
        <h3>Predicted Frames:</h3>
        {% for i in range(10) %}
            <img src="{{ url_for('static', filename='frame_' ~ i ~ '.png') }}" width="120">
        {% endfor %}
    {% endif %}

</body>
</html>
